services:
  postgres:
    image: postgres:17-alpine
    container_name: sso-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: sso
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sso"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s

  sso:
    build: .
    container_name: sso-app
    environment:
      DATABASE_URL: postgres://user:pass@postgres:5432/sso?sslmode=disable
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: