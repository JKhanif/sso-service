version: '3'

vars:
  PROTO_DIR: proto
  OUT_DIR: gen/go

tasks:
  generate:
    desc: Generate Go code from proto files
    cmds:
      - protoc --proto_path={{.PROTO_DIR}} --go_out={{.OUT_DIR}} --go_opt=paths=source_relative --go-grpc_out={{.OUT_DIR}} --go-grpc_opt=paths=source_relative sso/sso.proto
